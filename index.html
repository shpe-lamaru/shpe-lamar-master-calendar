<title> SHPE Lamar University Master Calendar 2026–27 </title>
<style id="page-style">
:root{
  --navy:#1B2A5A; --orange:#D84127; --paper:#FAFBFD; --surface:#FFFFFF;
  --ink:#16213A; --muted:#5B6781; --line:#DCE3EE; --soft:#EEF2F8;
  --c-gbm:#1B2A5A; --c-pro:#1273B8; --c-fam:#F26B38; --c-out:#4E97B4; --c-conf:#D84127; --c-admin:#6B7489; --c-heritage:#C9930F;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --navy:#A9BCE6; --orange:#F0654A; --paper:#0E1629; --surface:#152039; --ink:#E8EDF7; --muted:#9AA7C0;
    --line:#26324D; --soft:#1B2743; --c-gbm:#A9BCE6; --c-pro:#4FA3E0; --c-fam:#F58A5C; --c-out:#8FC4D8;
    --c-conf:#F0654A; --c-admin:#98A2B8; --c-heritage:#F0C24B; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --navy:#A9BCE6; --orange:#F0654A; --paper:#0E1629; --surface:#152039; --ink:#E8EDF7; --muted:#9AA7C0;
  --line:#26324D; --soft:#1B2743; --c-gbm:#A9BCE6; --c-pro:#4FA3E0; --c-fam:#F58A5C; --c-out:#8FC4D8;
  --c-conf:#F0654A; --c-admin:#98A2B8; --c-heritage:#F0C24B; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Georgia,"Times New Roman",Times,serif;font-size:16px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:28px 20px 60px}

header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.brand{display:flex;align-items:center;gap:18px}
.logo{width:92px;height:auto;flex:none;background:#fff;border-radius:12px;padding:8px 10px}
.brand h1{margin:0;font-size:clamp(32px,6vw,58px);line-height:.95;font-weight:800;letter-spacing:-.01em;color:var(--navy)}
.brand p{margin:10px 0 0;color:var(--muted);font-size:15px}
.brand .chapter{color:var(--ink);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
[hidden]{display:none!important}

.ribbon{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-bottom:26px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.rib-m{border:0;background:transparent;border-radius:8px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:stretch;gap:5px;min-width:0}
.rib-m:hover{background:var(--soft)}
.rib-m.on{background:var(--navy);color:var(--paper)}
.rib-m .lbl{font-size:14px;font-weight:700;text-align:center}
.rib-m .yr{font-size:11px;opacity:.7;text-align:center;margin-top:-5px}
.rib-bar{display:flex;gap:2px;height:30px;align-items:flex-end;justify-content:center}
.rib-bar i{display:block;width:6px;border-radius:2px 2px 0 0}
.rib-m .cnt{font-size:11px;text-align:center;opacity:.7}

.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:14px}
.nav{display:flex;align-items:center;gap:6px}
.nav h2{margin:0 8px;font-size:24px;font-weight:700;}
.icon{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:20px;line-height:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.seg button{border:0;background:var(--surface);padding:8px 14px;font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--navy);color:var(--paper)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 9px;font-size:13px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.chip[aria-pressed="false"]{opacity:.5;text-decoration:line-through}
.chip[aria-pressed="false"] .dot{background:transparent!important;box-shadow:inset 0 0 0 2px var(--muted)}

.grid-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));min-width:770px}
.dow{padding:9px 10px;font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line)}
.day{min-height:112px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.day:nth-child(7n){border-right:0}
.day.out{background:var(--soft)}
.day.out .num{opacity:.4}
.num{font-size:13px;font-weight:600;padding:1px 6px;align-self:flex-start;border-radius:6px}
.day.today .num{background:var(--orange);color:#fff}
.ev{display:block;width:100%;text-align:left;border:0;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border-radius:4px;padding:3px 6px;font-size:12px;line-height:1.3;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev:hover{background:color-mix(in srgb,var(--c) 26%,transparent)}
.ev.cont{border-left-style:dotted;font-weight:500}
.ev .t{font-weight:500;color:var(--muted);margin-right:4px}
.more{font-size:11px;color:var(--muted);border:0;background:none;text-align:left;padding:0 4px}

.list h3{font-size:20px;font-weight:700;margin:28px 0 6px;color:var(--navy);border-bottom:2px solid var(--line);padding-bottom:6px}
.list h3:first-child{margin-top:0}
.row{display:grid;grid-template-columns:88px 1fr;gap:14px;padding:12px 6px;border:0;border-bottom:1px solid var(--line);width:100%;text-align:left;background:none}
.row:hover{background:var(--soft)}
.row .d{font-weight:700;}
.row .d small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.row .title{font-weight:600;display:flex;align-items:center;gap:8px}
.row .meta{display:block;color:var(--muted);font-size:14px;margin-left:18px}
.empty{padding:34px 20px;text-align:center;color:var(--muted)}

dialog{border:0;border-radius:14px;padding:0;width:min(520px,calc(100vw - 24px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(10,20,50,.35)}
dialog::backdrop{background:rgba(12,22,48,.45)}
.dlg{padding:22px}
.dlg h3{margin:4px 0 0;font-size:22px;font-weight:700;line-height:1.2}
.dlg .cat{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.dlg dl{display:grid;grid-template-columns:80px 1fr;gap:8px 12px;margin:16px 0}
.dlg dt{color:var(--muted);font-size:14px}
.dlg dd{margin:0;white-space:pre-wrap}
.form{display:grid;gap:12px;margin-top:14px}
.form label{display:grid;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
.form input,.form select,.form textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);font-size:15px;font-weight:400;width:100%;min-width:0}
.form textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.dlg-actions .danger{margin-right:auto;color:var(--c-conf);border-color:transparent;background:none;padding-left:0}
.err{color:var(--c-conf);font-size:14px;margin:10px 0 0}

.status{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:10;max-width:calc(100vw - 32px)}
.suggest{display:flex;align-items:center;gap:24px;margin-top:28px;padding:20px;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--orange);border-radius:12px}
.suggest h2{margin:0 0 6px;font-size:22px;color:var(--navy)}
.suggest p{margin:0 0 14px;color:var(--muted);max-width:52ch}
.suggest .btn{display:inline-block;text-decoration:none}
.qr-link{flex:none;display:block;border-radius:8px;line-height:0}
.qr{width:140px;height:140px;display:block;border-radius:8px}
.note{font-size:13px;color:var(--muted);margin-top:18px}

@media (max-width:720px){
  .suggest{flex-direction:column;align-items:flex-start}
  .logo{width:64px}
  .ribbon{grid-template-columns:repeat(5,minmax(0,1fr))}
  .nav h2{font-size:20px}
  .seg{margin-left:0}
  .two{grid-template-columns:1fr}
}
</style>
</head>

  function short(d){ return d.toLocaleDateString("en-US",{month:"short",day:"numeric"}); }

  function renderHeader(){
    $("chapterName").textContent = "SHPE " + state.chapter;
    $("yearLabel").textContent = " 2026–27 academic year ";
    document.title = "SHPE " + state.chapter + " Master Calendar 2026–27 ";
  }
  function renderRibbon(){
    var evs=visible();
    var counts=MONTHS.map(function(mo){return evs.filter(function(e){return touchesMonth(e,mo);});});
    var max=1; counts.forEach(function(c){ Object.keys(CATS).forEach(function(k){ max=Math.max(max,c.filter(function(e){return e.cat===k;}).length); }); });
    $("ribbon").innerHTML = MONTHS.map(function(mo,i){
      var inM=counts[i];
      var bars=Object.keys(CATS).map(function(k){
        var n=inM.filter(function(e){return e.cat===k;}).length;
        return n?'<i style="background:'+color(k)+';height:'+Math.max(6,Math.round(n/max*30))+'px"></i>':"";
      }).join("") || '<i style="background:var(--line);height:3px;width:22px"></i>';
      return '<button class="rib-m'+(i===ui.month&&ui.view==="month"?" on":"")+'" data-i="'+i+'" aria-label="'+MNAMES[mo.m]+' '+mo.y+', '+inM.length+' events">'+
        '<span class="lbl">'+MNAMES[mo.m].slice(0,3)+'</span><span class="yr">'+mo.y+'</span><span class="rib-bar">'+bars+'</span>'+
        '<span class="cnt">'+inM.length+' event'+(inM.length===1?"":"s")+'</span></button>';
    }).join("");
  }
  function renderFilters(){
    $("filters").innerHTML = Object.keys(CATS).map(function(k){
      return '<button class="chip" data-cat="'+k+'" aria-pressed="'+(!ui.off.has(k))+'"><span class="dot" style="background:'+color(k)+'"></span>'+esc(CATS[k].name)+'</button>';
    }).join("");
  }
  function renderView(){
    var mo=MONTHS[ui.month];
    $("monthTitle").textContent = ui.view==="month" ? MNAMES[mo.m]+" "+mo.y : "August 2026 to May 2027";
    $("prevBtn").disabled = ui.view!=="month" || ui.month===0;
    $("nextBtn").disabled = ui.view!=="month" || ui.month===MONTHS.length-1;
    $("viewMonth").setAttribute("aria-pressed", ui.view==="month");
    $("viewList").setAttribute("aria-pressed", ui.view==="list");
    if (ui.view==="list") return renderList();
    var first=new Date(mo.y,mo.m,1), start=new Date(mo.y,mo.m,1-first.getDay());
    var last=new Date(mo.y,mo.m+1,0), cells=Math.ceil((first.getDay()+last.getDate())/7)*7;
    var evs=visible(), todayIso=iso(new Date());
    var html='<div class="grid-wrap"><div class="grid">'+DOW.map(function(d){return '<div class="dow">'+d+'</div>';}).join("");
    for (var i=0;i<cells;i++){
      var d=new Date(start.getFullYear(),start.getMonth(),start.getDate()+i), di=iso(d);
      var dayEvs=evs.filter(function(e){return e.start<=di && endOf(e)>=di;});
      html+='<div class="day'+(d.getMonth()!==mo.m?" out":"")+(di===todayIso?" today":"")+'"><span class="num">'+d.getDate()+'</span>'+
        dayEvs.slice(0,3).map(function(e){
          var cont=e.start!==di && d.getDay()!==0 && d.getDate()!==1;
          var mid=e.start!==di;
          return '<button class="ev'+(mid?" cont":"")+'" style="--c:'+color(e.cat)+'" data-id="'+esc(e.id)+'" title="'+esc(e.title)+'">'+
            (!mid&&e.time?'<span class="t">'+esc(e.time.split(" –")[0])+'</span>':"")+(cont?"":esc(e.title))+(cont?"&nbsp;":"")+'</button>';
        }).join("")+
        (dayEvs.length>3?'<button class="more" data-day="'+di+'">+'+(dayEvs.length-3)+' more</button>':"")+'</div>';
    }
    html+='</div></div>';
    if (!evs.some(function(e){return touchesMonth(e,mo);})) html+='<p class="empty">Nothing scheduled in '+MNAMES[mo.m]+' yet.'+(canEdit?" Use Add event to plan something.":"")+'</p>';
    $("view").innerHTML=html;
  }
  function renderList(){
    var evs=visible();
    if (!evs.length){ $("view").innerHTML='<p class="empty">No events match these filters. Turn a category back on to see its events.</p>'; return; }
    var html='<div class="list">';
    MONTHS.forEach(function(mo){
      var inM=evs.filter(function(e){var a=parse(e.start); return a.getFullYear()===mo.y && a.getMonth()===mo.m;});
      if (!inM.length) return;
      html+='<h3>'+MNAMES[mo.m]+' '+mo.y+'</h3>'+inM.map(function(e){
        var a=parse(e.start), multi=e.end&&e.end!==e.start;
        var meta=[e.time,e.location].filter(Boolean).map(esc).join(", ");
        return '<button class="row" data-id="'+esc(e.id)+'"><span class="d">'+short(a)+'<small>'+(multi?"to "+short(parse(e.end)):DOW[a.getDay()])+'</small></span>'+
          '<span><span class="title"><span class="dot" style="background:'+color(e.cat)+'"></span>'+esc(e.title)+'</span>'+(meta?'<span class="meta">'+meta+'</span>':"")+'</span></button>';
      }).join("");
    });
    $("view").innerHTML=html+'</div>';
  }
  function renderAll(){
    renderHeader(); renderRibbon(); renderFilters(); renderView();
    $("addBtn").hidden=!canEdit; $("settingsBtn").hidden=!canEdit; $("exportBtn").hidden=false;
    $("footNote").textContent = canEdit
      ? "Changes you save here update the calendar for everyone with the link. Events marked TBD or TBA are placeholders."
      : "Events marked TBD or TBA are placeholders. Check with your chapter officers for final details.";
  }

  function openEvent(id){
    var e=state.events.find(function(x){return x.id===id;}); if(!e) return;
    $("dlgBody").innerHTML='<span class="cat"><span class="dot" style="background:'+color(e.cat)+'"></span>'+esc((CATS[e.cat]||{}).name||"")+'</span>'+
      '<h3>'+esc(e.title)+'</h3><dl><dt>When</dt><dd>'+esc(fmtRange(e))+(e.time?"\n"+esc(e.time):"")+'</dd>'+
      (e.location?'<dt>Where</dt><dd>'+esc(e.location)+'</dd>':"")+(e.notes?'<dt>Notes</dt><dd>'+esc(e.notes)+'</dd>':"")+'</dl>'+
      '<div class="dlg-actions">'+(canEdit?'<button class="btn" data-act="edit" data-id="'+esc(e.id)+'">Edit event</button>':"")+'<button class="btn primary" data-act="close">Close</button></div>';
    $("dlg").showModal();
  }
  function openDay(di){
    var evs=visible().filter(function(e){return e.start<=di && endOf(e)>=di;});
    $("dlgBody").innerHTML='<h3>'+esc(parse(di).toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"}))+'</h3><div class="list" style="margin-top:10px">'+
      evs.map(function(e){return '<button class="row" data-id="'+esc(e.id)+'"><span class="d" style="font-size:13px">'+esc(e.time?e.time.split(" –")[0]:"All day")+'</span><span><span class="title"><span class="dot" style="background:'+color(e.cat)+'"></span>'+esc(e.title)+'</span></span></button>';}).join("")+
      '</div><div class="dlg-actions"><button class="btn primary" data-act="close">Close</button></div>';
    $("dlg").showModal();
  }
  function openForm(id){
    var mo=MONTHS[ui.month];
    var e=id?state.events.find(function(x){return x.id===id;}):{title:"",start:iso(new Date(mo.y,mo.m,1)),end:"",time:"",location:"",cat:"gbm",notes:""};
    $("dlgBody").innerHTML='<h3>'+(id?"Edit event":"Add event")+'</h3><div class="form">'+
      '<label>Title<input id="f-title" value="'+esc(e.title)+'" placeholder="GBM: Resume workshop"></label>'+
      '<div class="two"><label>Date<input id="f-start" type="date" min="2026-08-01" max="2027-05-31" value="'+esc(e.start)+'"></label>'+
      '<label>End date, for multi-day events<input id="f-end" type="date" min="2026-08-01" max="2027-05-31" value="'+esc(e.end)+'"></label></div>'+
      '<div class="two"><label>Time<input id="f-time" value="'+esc(e.time)+'" placeholder="6:00 PM"></label>'+
      '<label>Category<select id="f-cat">'+Object.keys(CATS).map(function(k){return '<option value="'+k+'"'+(k===e.cat?" selected":"")+'>'+esc(CATS[k].name)+'</option>';}).join("")+'</select></label></div>'+
      '<label>Location<input id="f-loc" value="'+esc(e.location)+'" placeholder="Engineering building, room 101"></label>'+
      '<label>Notes<textarea id="f-notes" placeholder="Speaker, food, who is in charge">'+esc(e.notes)+'</textarea></label></div>'+
      '<p class="err" id="f-err" hidden></p><div class="dlg-actions">'+
      (id?'<button class="btn danger" data-act="delete" data-id="'+esc(id)+'">Delete event</button>':"")+
      '<button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save" data-id="'+esc(id||"")+'">'+(id?"Save changes":"Add event")+'</button></div>';
    $("dlg").showModal(); $("f-title").focus();
  }
  function openSettings(){
    $("dlgBody").innerHTML='<h3>Chapter name</h3><div class="form"><label>Shown after “SHPE” at the top of the calendar<input id="f-chapter" value="'+esc(state.chapter)+'" placeholder="Lamar University"></label></div>'+
      '<p class="err" id="f-err" hidden></p><div class="dlg-actions"><button class="btn" data-act="close">Cancel</button><button class="btn primary" data-act="save-chapter">Save name</button></div>';
    $("dlg").showModal(); $("f-chapter").focus();
  }

  $("dlg").addEventListener("click", function(ev){
    var dlg=$("dlg");
    if (ev.target===dlg){ dlg.close(); return; }
    var b=ev.target.closest("button"); if(!b) return;
    if (b.classList.contains("row") && b.dataset.id){ dlg.close(); openEvent(b.dataset.id); return; }
    var act=b.dataset.act;
    if (act==="close") dlg.close();
    else if (act==="edit"){ dlg.close(); openForm(b.dataset.id); }
    else if (act==="delete"){
      if (!confirm("Delete this event for everyone?")) return;
      save({chapter:state.chapter, events:state.events.filter(function(x){return x.id!==b.dataset.id;})}, "Deleted");
    }
    else if (act==="save-chapter"){
      var name=$("f-chapter").value.trim();
      if (!name){ $("f-err").textContent="Enter a chapter name to save."; $("f-err").hidden=false; return; }
      save({chapter:name, events:state.events}, "Saved");
    }
    else if (act==="save"){
      var f={title:$("f-title").value.trim(), start:$("f-start").value, end:$("f-end").value, time:$("f-time").value.trim(), location:$("f-loc").value.trim(), cat:$("f-cat").value, notes:$("f-notes").value.trim()};
      var err=$("f-err");
      if (!f.title||!f.start){ err.textContent="Add a title and a date to save this event."; err.hidden=false; return; }
      if (f.end && f.end<f.start){ err.textContent="The end date is before the start date. Pick a later end date or clear it."; err.hidden=false; return; }
      if (f.end===f.start) f.end="";
      var id=b.dataset.id;
      var events=id?state.events.map(function(x){return x.id===id?Object.assign({},x,f):x;}):state.events.concat([Object.assign({id:"e"+Date.now().toString(36)},f)]);
      var a=parse(f.start), idx=MONTHS.findIndex(function(mo){return a.getFullYear()===mo.y&&a.getMonth()===mo.m;});
      if (idx>=0){ ui.month=idx; }
      save({chapter:state.chapter, events:events}, id?"Saved":"Added");
    }
  });

  function buildPage(next){
    var json=JSON.stringify(next).replace(/</g,"\\u003c");
    return '<!doctype html>\n<html lang="en">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'+
      '<title>'+esc("SHPE "+next.chapter+" Master Calendar 2026–27")+'</title>\n'+
      '\n\n'+
      '\n'+
      '<style id="page-style">'+styleText+'</style>\n</head>\n<body>\n<div id="root"></div>\n'+
      '<script type="application/json" id="cal-data">'+json+'<\/script>\n'+
      '<script id="cal-app">'+appText+'<\/script>\n</body>\n</html>\n';
  }
  function flash(msg,ms){ var s=$("status"); s.textContent=msg; s.hidden=false; clearTimeout(flash._t); if(ms) flash._t=setTimeout(function(){s.hidden=true;},ms); }
  function stashUI(){ try{ sessionStorage.setItem("shpe-cal-ui", JSON.stringify({month:ui.month,view:ui.view,off:Array.from(ui.off)})); }catch(e){} }

  function save(next, verb){
    if (busy) return;
    if (!artifact||!canEdit){ flash("This calendar is view-only for you.",3000); return; }
    busy=true; stashUI(); flash("Saving…");
    artifact.publish(buildPage(next)).then(function(){
      state=next; $("dlg").close(); flash(verb,1500); renderAll();
    }).catch(function(err){
      var code=err&&err.code;
      if (code==="conflict"){ flash("Someone else just updated the calendar. Loading their version…"); }
      else if (["not_writer","not_granted","not_declared","consent_required","capability_disabled","capability_removed"].indexOf(code)>=0){
        canEdit=false; $("dlg").close(); renderAll(); flash("You can view this calendar but not edit it. Ask the owner for edit access.",5000);
      }
      else if (code==="rate_limited"){ flash("Too many saves in a row. Wait a moment, then save again.",4000); }
      else if (code==="too_large"){ flash("The calendar is too large to save. Remove some events and save again.",5000); }
      else { flash("Your change didn't save. Check your connection and save again.",4000); }
    }).then(function(){ busy=false; });
  }

  function toICS(){
    var pad=function(s){return s.replace(/-/g,"");};
    var e2=function(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");};
    var stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
    var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//SHPE Chapter//Master Calendar//EN","CALSCALE:GREGORIAN","X-WR-CALNAME:"+e2("SHPE "+state.chapter)];
    state.events.forEach(function(e){
      var end=parse(endOf(e)); end.setDate(end.getDate()+1);
      L.push("BEGIN:VEVENT","UID:"+e.id+"@shpe-master-calendar","DTSTAMP:"+stamp,"DTSTART;VALUE=DATE:"+pad(e.start),"DTEND;VALUE=DATE:"+pad(iso(end)),
        "SUMMARY:"+e2(e.title),"LOCATION:"+e2(e.location),"DESCRIPTION:"+e2([e.time,e.notes].filter(Boolean).join("\n")),"END:VEVENT");
    });
    L.push("END:VCALENDAR"); return L.join("\r\n");
  }

  $("exportBtn").addEventListener("click", function(){
    if (!downloads){
      var blob=new Blob([toICS()],{type:"text/calendar"}), a=document.createElement("a");
      a.href=URL.createObjectURL(blob); a.download="shpe-lamar-calendar-2026-27.ics";
      document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href); a.remove();},1000);
      return;
    }
    downloads.save({filename:"shpe-master-calendar-2026-27.ics", data:toICS()}).catch(function(err){
      if (!err||err.code!=="declined") flash("The export didn't download. Try again in a moment.",3500);
    });
  });
  $("ribbon").addEventListener("click", function(e){ var b=e.target.closest(".rib-m"); if(!b) return; ui.month=+b.dataset.i; ui.view="month"; renderRibbon(); renderView(); });
  $("filters").addEventListener("click", function(e){ var b=e.target.closest(".chip"); if(!b) return; var k=b.dataset.cat; if(ui.off.has(k)) ui.off.delete(k); else ui.off.add(k); renderRibbon(); renderFilters(); renderView(); });
  $("prevBtn").addEventListener("click", function(){ if(ui.month>0){ ui.month--; renderRibbon(); renderView(); } });
  $("nextBtn").addEventListener("click", function(){ if(ui.month<MONTHS.length-1){ ui.month++; renderRibbon(); renderView(); } });
  $("viewMonth").addEventListener("click", function(){ ui.view="month"; renderRibbon(); renderView(); });
  $("viewList").addEventListener("click", function(){ ui.view="list"; renderRibbon(); renderView(); });
  $("view").addEventListener("click", function(e){ var b=e.target.closest("button"); if(!b) return; if(b.dataset.id) openEvent(b.dataset.id); else if(b.dataset.day) openDay(b.dataset.day); });
  $("addBtn").addEventListener("click", function(){ openForm(null); });
  $("settingsBtn").addEventListener("click", openSettings);

  renderAll();

  if (false){
    window.claude.use("artifact").then(function(a){ if(a){ artifact=a; canEdit=true; renderAll(); } }).catch(function(){});
    window.claude.use("downloads").then(function(d){ if(d){ downloads=d; renderAll(); } }).catch(function(){});
  }
})();
</script>
</body>
</html>
